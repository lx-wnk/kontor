name: CI

on:
  push:
    branches: [main]
  # No branch filter: a PR targeting a feature branch (a stacked PR) must be
  # tested too. With `branches: [main]` those ran no jobs at all, which
  # renders on the PR as "no checks" rather than as untested.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    outputs:
      workspace_modules: ${{ steps.lists.outputs.workspace_modules }}
      plugins: ${{ steps.lists.outputs.plugins }}
      scan_modules: ${{ steps.lists.outputs.scan_modules }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain consistency
        # go has no way to inherit the `go` directive: go.work's own directive
        # only governs how go.work itself is parsed, and a module must stand
        # alone for outside consumers. So the directives are checked against
        # .go-version instead of derived from it.
        run: |
          want="go $(cut -d. -f1,2 < .go-version)"
          rc=0
          for f in go.work $(git ls-files '*go.mod'); do
            have="$(grep -m1 -E '^go ' "$f" || echo '<missing>')"
            if [ "$have" != "$want" ]; then
              echo "::error file=$f::expected '$want', found '$have'"
              rc=1
            fi
            if grep -q '^toolchain ' "$f"; then
              echo "::error file=$f::toolchain directive is a second pin next to .go-version — remove it"
              rc=1
            fi
          done
          if [ "$rc" -eq 0 ]; then echo "all go directives match .go-version"; fi
          exit "$rc"

      # Single source for every matrix below. These lists live in a job output
      # rather than a workflow-level `env:` because strategy.matrix cannot read
      # the env context (allowed there: github, needs, vars, inputs).
      # desktop/ is absent on purpose: it is //go:build darwin and has its own
      # macOS job.
      - id: lists
        run: |
          WORKSPACE_MODULES='["server", "sdk"]'
          # Derived from what is on disk, not from a list kept in step with it.
          # A module added or removed in plugins/ must not also have to be
          # remembered here, and a module that lives outside this repository
          # simply is not found — which is the point of the module contract.
          PLUGINS=$(find plugins -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/go.mod' \; -print \
            | sed 's|^plugins/||' | sort | jq -Rnc '[inputs]')
          {
            echo "workspace_modules=$WORKSPACE_MODULES"
            echo "plugins=$PLUGINS"
            echo "scan_modules=$(jq -nc --argjson m "$WORKSPACE_MODULES" --argjson p "$PLUGINS" '$m + ($p | map("plugins/" + .))')"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.matrix.outputs.workspace_modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.work.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ${{ matrix.module }}/.testcoverage.yml
          profile: ${{ matrix.module }}/coverage.out
          source-dir: ${{ matrix.module }}

      - name: Per-package coverage gate (pipeline + services)
        if: matrix.module == 'server'
        # Floor is intentionally set to the current per-package coverage so the
        # gate catches regressions immediately. Ratchet upward toward 70 as
        # tests are added. Override per-run via repo/Actions env if needed.
        env:
          COVERAGE_THRESHOLD: '20'
        run: |
          cd server
          go tool cover -func=coverage.out > coverage.func.txt
          cd ..
          bash scripts/coverage-gate.sh server/coverage.out 'internal/pipeline' 'internal/services'

  test-plugins:
    name: Test (plugins/${{ matrix.plugin }})
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.matrix.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum

      - name: Test
        working-directory: plugins/${{ matrix.plugin }}
        run: GOWORK=off go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: plugins/${{ matrix.plugin }}/.testcoverage.yml
          profile: plugins/${{ matrix.plugin }}/coverage.out
          source-dir: plugins/${{ matrix.plugin }}

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.matrix.outputs.workspace_modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.work.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Verify golangci config
        working-directory: ${{ matrix.module }}
        # The schema is fetched from golangci-lint.run at runtime and there is no
        # offline flag, so a transient network failure fails the job. With eight
        # lint jobs per run, a ~1% per-fetch failure rate turns ~8% of runs red.
        # Retrying beats dropping the step: `golangci-lint run` does NOT validate
        # config structure — an unknown key or a mistyped section is silently
        # ignored there, so this is the only check that catches it.
        run: |
          for attempt in 1 2 3; do
            golangci-lint config verify && exit 0
            echo "config verify failed (attempt ${attempt}/3) — retrying" >&2
            sleep 5
          done
          exit 1
      - name: Check formatting
        working-directory: ${{ matrix.module }}
        # `golangci-lint run` reports only some formatting violations, so it
        # cannot stand in for this step.
        run: golangci-lint fmt --diff ./...
      - name: Lint
        working-directory: ${{ matrix.module }}
        run: golangci-lint run ./...

  lint-plugins:
    name: Lint (plugins/${{ matrix.plugin }})
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.matrix.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: plugins/${{ matrix.plugin }}/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - name: Verify golangci config
        working-directory: plugins/${{ matrix.plugin }}
        # The schema is fetched from golangci-lint.run at runtime and there is no
        # offline flag, so a transient network failure fails the job. With eight
        # lint jobs per run, a ~1% per-fetch failure rate turns ~8% of runs red.
        # Retrying beats dropping the step: `golangci-lint run` does NOT validate
        # config structure — an unknown key or a mistyped section is silently
        # ignored there, so this is the only check that catches it.
        run: |
          for attempt in 1 2 3; do
            GOWORK=off golangci-lint config verify && exit 0
            echo "config verify failed (attempt ${attempt}/3) — retrying" >&2
            sleep 5
          done
          exit 1
      - name: Check formatting
        working-directory: plugins/${{ matrix.plugin }}
        # `golangci-lint run` reports only some formatting violations, so it
        # cannot stand in for this step.
        run: GOWORK=off golangci-lint fmt --diff ./...
      - name: Lint
        working-directory: plugins/${{ matrix.plugin }}
        run: GOWORK=off golangci-lint run ./...

  security:
    name: Security (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.matrix.outputs.scan_modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          # sdk has no go.sum (workspace member, no external deps); go.work.sum
          # guarantees at least one resolvable path so setup-go caching never errors.
          cache-dependency-path: |
            go.work.sum
            ${{ matrix.module }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: GOWORK=off govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [matrix, test, lint, test-plugins, lint-plugins]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Build server binary
        working-directory: server
        run: go build -o /dev/null ./cmd/serve/...
      - name: Build plugin binaries
        env:
          PLUGINS: ${{ needs.matrix.outputs.plugins }}
        run: |
          for plugin in $(echo "$PLUGINS" | jq -r '.[]'); do
            dir="plugins/$plugin"
            # No main package means a shared library (oauthkit) — nothing to build.
            grep -lq '^package main' "$dir"/*.go || continue
            echo "=== building $dir ===" && (cd "$dir" && GOWORK=off go build -o /dev/null .)
          done

  frontend:
    name: Frontend (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.check }}
        run: pnpm ${{ matrix.check }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build server binary with embedded SPA
        # scripts/e2e-server.sh rebuilds through `task` only when bin/kontor
        # is missing or older than a source file; building it here keeps go-task
        # out of the runner.
        run: |
          pnpm build
          cd server && go build -o ../bin/kontor ./cmd/serve/...
      - name: Run Playwright suite
        run: pnpm test:e2e

  frontend-build:
    name: Frontend Build & Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Verify build artifacts present
        run: test -d server/frontend/dist/assets || { echo "server/frontend/dist/assets missing — vite build did not emit SPA assets"; exit 1; }
      - name: Check bundle-size budget
        # Thresholds can be tightened/loosened via env without editing the script.
        # Per-chunk JS budgets: vendor (vue) 200 KB, charts (d3) 400 KB, index 100 KB.
        env:
          JS_MAX_GZIP_KB: '100'
          JS_VENDOR_MAX_GZIP_KB: '200'
          JS_CHARTS_MAX_GZIP_KB: '400'
          CSS_MAX_GZIP_KB: '30'
        run: bash scripts/check-bundle-size.sh server/frontend/dist/assets
  licenses:
    name: License Attribution Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.work.sum
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Regenerate THIRD_PARTY_LICENSES.md
        run: ./scripts/gen-licenses.sh
      - name: Verify it is up to date
        run: |
          git diff --exit-code -- THIRD_PARTY_LICENSES.md || {
            echo "THIRD_PARTY_LICENSES.md is stale — run 'task licenses' and commit the result."
            exit 1
          }

  desktop-build:
    name: Desktop Shell Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.work.sum
      - name: Build desktop shell (real wails link path)
        working-directory: desktop
        # -tags production selects the real wails app; the extldflags links
        # UniformTypeIdentifiers, which wails needs on the macOS 15 SDK but a
        # plain build omits. This is the same incantation as `task build:desktop`.
        run: CGO_ENABLED=1 go build -tags production -ldflags "-extldflags '-framework UniformTypeIdentifiers'" -o /dev/null .

      - name: Build desktop shell (dev build tag)
        working-directory: desktop
        # -tags dev is what `wails dev` sets; nothing else compiles target_dev.go,
        # so it and target_other.go can silently drift without this build.
        run: CGO_ENABLED=1 go build -tags dev -ldflags "-extldflags '-framework UniformTypeIdentifiers'" -o /dev/null .

      - name: Test desktop shell (dev build tag)
        working-directory: desktop
        run: CGO_ENABLED=1 go test -tags dev -ldflags "-extldflags '-framework UniformTypeIdentifiers'" ./...

      - name: Test desktop shell (non-dev path)
        working-directory: desktop
        # target_test.go is `darwin && !dev`, so the dev run above never executes
        # it. This asserts the non-dev half of that pair -- not the shipping tag
        # set, which adds `-tags production` in the build step above.
        run: CGO_ENABLED=1 go test -ldflags "-extldflags '-framework UniformTypeIdentifiers'" ./...

  changelog:
    name: CHANGELOG heading guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No duplicate headings per release section
        run: bash scripts/check-changelog-headings.sh

  pr-checks:
    name: PR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
