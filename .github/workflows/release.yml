name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write # required for GHCR image push

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    env:
      GO_LICENSES_VERSION: v2.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for changelog generation

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # scripts/gen-licenses.sh (a GoReleaser `before` hook) needs go-licenses and
      # python3 (preinstalled on ubuntu-latest); pnpm install runs in the hook itself.
      - name: Cache go-licenses
        id: cache-go-licenses
        uses: actions/cache@v6
        with:
          path: ~/go/bin/go-licenses
          key: ${{ runner.os }}-go-licenses-${{ env.GO_LICENSES_VERSION }}-${{ hashFiles('.go-version') }}

      - name: Install go-licenses
        if: steps.cache-go-licenses.outputs.cache-hit != 'true'
        run: go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GoReleaser's `before` hooks run `pnpm install --frozen-lockfile`, generate the
      # third-party notices that ship in each archive, then `pnpm build`, emitting the
      # SPA into server/frontend/dist so the Go build embeds it.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
