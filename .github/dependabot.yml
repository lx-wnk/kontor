version: 2

updates:
  # --- Go modules ---
  # `directories` (plural) supports globbing, so /plugins/* covers every plugin
  # module — including ones added later — without a new entry per module.
  - package-ecosystem: gomod
    directories:
      - /server
      - /sdk
      - /desktop
      - /plugins/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # --- Frontend (npm) ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    ignore:
      # #565 bumped this to v2201, a tag that does not exist.
      - dependency-name: vladopajic/go-test-coverage
        versions: ['>= 3']
    groups:
      actions:
        update-types: [minor, patch]
