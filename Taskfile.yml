# Taskfile.yml
version: '3'

vars:
  # Authoritative when the dev servers are started through Task, which is the
  # supported flow. vite.config.ts and desktop/target_dev.go each keep a 5173
  # fallback for a bare `pnpm dev` / `wails dev`; if this value changes, those
  # two must change with it or the shell polls a port nothing serves.
  # Both dev:desktop children below export it -- a parent task's `env:` does not
  # reach its `deps`. Override per run: `task dev:desktop VITE_DEV_PORT=5199`.
  VITE_DEV_PORT: '5173'
  # Generated once per `task` invocation and re-exported by the same two
  # children as VITE_DEV_PORT above. vite.config.ts echoes it on a response
  # header and desktop/target_dev.go requires that header to match before
  # trusting the peer on the port is our Vite, not a squatter.
  DESKTOP_DEV_NONCE:
    sh: head -c 16 /dev/urandom | xxd -p | tr -d '\n'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # Must equal what CI installs; .go-version is the file it feeds to setup-go.
  GO_TOOLCHAIN:
    sh: printf 'go%s' "$(cat .go-version)"

# Two distinct effects, both needed: it decides how golangci-lint formats, since
# its formatter is compiled in when setup installs it, and what its typechecker
# can read at run time — a newer Go writes export data the linter cannot decode.
env:
  GOTOOLCHAIN: '{{.GO_TOOLCHAIN}}'

tasks:
  default:
    cmds: [task --list]

  dev:
    desc: Start Go backend + Vite frontend (requires air)
    deps: [dev:go, dev:frontend]

  dev:go:
    desc: Start Go backend with air hot-reload on :13120
    cmd: $(go env GOPATH)/bin/air -c .air.toml

  dev:frontend:
    desc: Start Vite dev server with HMR on :5173
    env:
      VITE_DEV_PORT: '{{.VITE_DEV_PORT}}'
      DESKTOP_DEV_NONCE: '{{.DESKTOP_DEV_NONCE}}'
    cmd: pnpm dev

  dev:desktop:
    desc: Run the macOS desktop shell with Vite frontend HMR (owns the backend on :13120 itself -- do not also run `task dev`; requires the wails CLI + Xcode CLT)
    platforms: [darwin]
    # No build:frontend here: `wails dev` always sets the dev build tag, under
    # which the window is redirected to Vite and never serves the embed (see
    # desktop/target_dev.go). Building it anyway cost a full SPA build per dev
    # start and deleted the tracked server/frontend/dist/.gitkeep that
    # //go:embed all:dist needs to compile in CI. build:desktop and
    # desktop:dist still depend on build:frontend, which is where it belongs.
    # Vite and wails are both long-running; deps run them concurrently and this
    # task blocks until both exit, the same pattern `dev` uses for its two.
    deps: [dev:frontend, dev:desktop:wails]

  dev:desktop:wails:
    internal: true
    platforms: [darwin]
    env:
      VITE_DEV_PORT: '{{.VITE_DEV_PORT}}'
      DESKTOP_DEV_NONCE: '{{.DESKTOP_DEV_NONCE}}'
    cmds:
      - echo "frontend now hot-reloads through Vite on :$VITE_DEV_PORT -- the wails -assetdir/-reloaddirs warning below is expected in this flow, not a bug"
      # No -tags production here: `wails dev` always adds its own `dev` tag, and
      # dev+production together redeclare App.Run/CreateApp in wails' app package.
      # The two release paths (build:desktop, desktop:dist) pass the tag explicitly.
      - cd desktop && $(go env GOPATH)/bin/wails dev -ldflags "-extldflags '-framework UniformTypeIdentifiers'"

  setup:
    desc: Install the dev toolchain (air, golangci-lint, tygo, govulncheck, go-licenses) + frontend deps
    cmds:
      - go install github.com/air-verse/air@latest
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
      - go install github.com/gzuidhof/tygo@latest
      # Version pinned to CI's (.github/workflows/ci.yml), like golangci-lint above.
      - go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
      - go install github.com/google/go-licenses/v2@v2.0.1
      - pnpm install
      - echo "✓ setup complete — run 'task doctor' to verify, then 'task dev'"

  doctor:
    desc: Check that all required tools are installed and on PATH
    cmd: ./scripts/doctor.sh

  build:frontend:
    desc: Build the Vue SPA into the Go embed dir (server/frontend/dist)
    # `once`: several tasks depend on this; without it go-task's default
    # (run: always) rebuilds the SPA for each of them in the same invocation.
    run: once
    cmds:
      - pnpm build
      # vite empties the out dir, taking the committed .gitkeep that
      # `//go:embed all:dist` needs with it. Restoring it here rather than
      # leaving it to the caller: a missing tracked file makes the tree dirty,
      # VERSION is `git describe --dirty`, and every build after this one would
      # stamp `-dirty` and report itself as stale in /api/system/health — the
      # one signal that exists to tell a stale binary from a current one.
      - git checkout HEAD -- server/frontend/dist/.gitkeep

  build:
    desc: Build server binary (embeds whatever is currently in server/frontend/dist)
    dir: server
    cmd: go build -ldflags "-X main.version={{.VERSION}}" -o ../bin/kontor ./cmd/serve/...

  build:all:
    desc: Build frontend and embed it into a self-contained server binary
    # Deliberately does NOT build the desktop shell: scripts/e2e-server.sh runs
    # this, and pulling in the CGO/wails build would make the Playwright suite
    # require Xcode CLT and blow its 180s server timeout. Use build:everything.
    cmds:
      - task: build:frontend
      - task: build

  build:everything:
    desc: Build the server binary and, on macOS, the desktop shell as well
    cmds:
      - task: build:all
      # macOS-only (platforms: [darwin]); Task skips it on other OSes, so this
      # task stays cross-platform.
      - task: build:desktop

  build:desktop:
    desc: Build the macOS desktop shell (embeds the SPA; requires macOS + Xcode CLT)
    platforms: [darwin]
    cmds:
      # The frontend must be embedded before the Go build, else the shell serves
      # an empty dist and the webview hits a redirect loop.
      - task: build:frontend
      # -tags production selects the real wails app (the untagged build errors at
      # runtime); the extldflags links UniformTypeIdentifiers, which wails needs
      # on the macOS 15 SDK but a plain `go build` omits.
      # The version is stamped here too: a desktop window that cannot name its
      # own build is indistinguishable from a stale one (see /api/system/health).
      - cd desktop && CGO_ENABLED=1 go build -tags production -ldflags "-X github.com/lx-wnk/kontor/server/internal/version.Version={{.VERSION}} -extldflags '-framework UniformTypeIdentifiers'" -o ../bin/kontor-desktop .

  desktop:run:
    desc: Build and launch the macOS desktop shell for a smoke test
    platforms: [darwin]
    cmds:
      - task: build:desktop
      - ./bin/kontor-desktop

  desktop:dist:
    desc: Package the macOS desktop shell into an unsigned bin/Kontor.app bundle (requires the wails CLI + Xcode CLT)
    platforms: [darwin]
    cmds:
      - defer: git checkout -- desktop/wails.json
      - task: build:frontend
      # wails has no CLI flag for productVersion — it only reads desktop/wails.json —
      # so stamp it in before the build and restore it via defer: above, which
      # runs even on failure. Block scalar: the pattern contains ": ", which
      # YAML would otherwise read as a mapping.
      - |
        sed -i '' "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"{{.VERSION}}\"/" desktop/wails.json
      # Same production tag + UniformTypeIdentifiers ldflag as build:desktop, driven
      # through `wails build` so it also renders desktop/wails.json + Info.plist into
      # a real .app bundle instead of a bare Mach-O binary.
      - cd desktop && $(go env GOPATH)/bin/wails build -clean -tags production -ldflags "-X github.com/lx-wnk/kontor/server/internal/version.Version={{.VERSION}} -extldflags '-framework UniformTypeIdentifiers'"
      - mkdir -p bin
      - rm -rf "bin/Kontor.app"
      - cp -R "desktop/build/bin/Kontor.app" bin/

  desktop:dmg:
    desc: Package bin/Kontor.app into an unsigned bin/Kontor.dmg (via hdiutil, no external tool needed)
    platforms: [darwin]
    cmds:
      - task: desktop:dist
      - rm -f "bin/Kontor.dmg"
      - hdiutil create -volname "Kontor" -srcfolder "bin/Kontor.app" -ov -format UDZO "bin/Kontor.dmg"

  desktop:bundle:
    desc: Replace the binary in bin/Kontor.app (from desktop:dist), stamp version and codesign (macOS; requires KONTOR_SIGN_IDENTITY)
    platforms: [darwin]
    vars:
      APP: bin/Kontor.app
      # CFBundleExecutable, rendered from desktop/wails.json "outputfilename".
      BINARY: bin/Kontor.app/Contents/MacOS/kontor-desktop
    # Checked before the build touches the bundle: a failure after the binary
    # swap would leave bin/Kontor.app with a broken signature.
    preconditions:
      - sh: test -f '{{.BINARY}}'
        msg: "bin/Kontor.app/Contents/MacOS/kontor-desktop is missing — run 'task desktop:dist' once first"
      - sh: test -n "$KONTOR_SIGN_IDENTITY"
        msg: KONTOR_SIGN_IDENTITY is not set — see docs/code-signing.md
      - sh: security find-identity -v -p codesigning 2>/dev/null | grep -qF "$KONTOR_SIGN_IDENTITY"
        msg: "KONTOR_SIGN_IDENTITY is not a valid code-signing identity in the keychain — run 'security find-identity -v -p codesigning', then see docs/code-signing.md"
    cmds:
      - task: build:desktop
      - rm -f '{{.BINARY}}'
      - cp bin/kontor-desktop '{{.BINARY}}'
      - /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString {{.VERSION}}' '{{.APP}}/Contents/Info.plist'
      - /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion {{.VERSION}}' '{{.APP}}/Contents/Info.plist'
      - codesign --force --deep --sign "$KONTOR_SIGN_IDENTITY" --identifier com.lxwnk.kontor '{{.APP}}'
      - codesign --verify --deep --strict '{{.APP}}'

  test:
    desc: Run all tests (all modules)
    cmds:
      - cd sdk && go test -race ./...
      - cd server && go test -race ./...

  test:cover:
    desc: Run tests with coverage report (server module)
    dir: server
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  lint:
    desc: Run golangci-lint and the formatter check (all modules)
    cmds:
      # `run` reports only some formatting violations; `fmt --diff` reports all
      # of them and exits non-zero on any diff.
      - cd sdk && golangci-lint fmt --diff ./... && golangci-lint run ./...
      - cd server && golangci-lint fmt --diff ./... && golangci-lint run ./...
      - for d in plugins/*/; do [ -d "$d" ] || continue; (cd "$d" && GOWORK=off golangci-lint fmt --diff ./... && GOWORK=off golangci-lint run ./...) || exit 1; done

  changelog:check:
    desc: 'Fail when CHANGELOG.md repeats a release heading or a ### heading within one release'
    cmds:
      - sh scripts/check-changelog-headings.sh

  generate:
    desc: Run go generate (ent schemas) and tygo TS codegen
    cmds:
      - $(go env GOPATH)/bin/tygo generate --config tygo.yaml
      # tygo emits semicolons and /* int */ comments that this project's eslint
      # style rejects — 249 errors, all auto-fixable. Without this the task
      # leaves a file `pnpm lint` fails on, which is why the SDK types ended up
      # being hand-maintained instead of generated.
      - pnpm eslint --fix src/sdk.generated.ts
      - cd server && go generate ./...
      # ent's //go:generate runs `go run -mod=mod`, which writes entc's own
      # dependencies into server/go.sum. Left there they fail the licence job's
      # tidiness pre-flight, in a module nobody knowingly edited.
      - cd server && go mod tidy

  vuln:
    desc: Run govulncheck
    cmds:
      - cd sdk && govulncheck ./...
      - cd server && govulncheck ./...

  licenses:
    desc: Generate THIRD_PARTY_LICENSES.md from Go and frontend dependencies
    cmd: ./scripts/gen-licenses.sh

  audit:frontend:
    desc: Run pnpm audit on frontend dependencies (fails on high or critical vulnerabilities)
    cmd: pnpm audit --audit-level=high

  fmt:
    desc: Format all Go code (the formatter lint checks, not bare gofmt)
    cmds:
      - cd sdk && golangci-lint fmt ./...
      - cd server && golangci-lint fmt ./...
      - for d in plugins/*/; do [ -d "$d" ] || continue; (cd "$d" && GOWORK=off golangci-lint fmt ./...) || exit 1; done
