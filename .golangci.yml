version: '2'
linters:
  enable:
    - depguard
    - gosec
    - misspell
    - revive
  settings:
    depguard:
      rules:
        no-pipeline-from-rawrepo:
          list-mode: lax
          files:
            - '**/internal/db/rawrepo/**'
          deny:
            - pkg: github.com/lx-wnk/kontor/server/internal/pipeline
              desc: db/rawrepo is a low-level persistence package and must not import the pipeline orchestration core (layer-direction inversion); use internal/proc for process-liveness checks (ADR-0009)
        no-pluginmgmt-from-plugin:
          list-mode: lax
          files:
            - '**/internal/plugin/**'
          deny:
            - pkg: github.com/lx-wnk/kontor/server/internal/pluginmgmt
              desc: plugin is the runtime (registry, lifecycle, settings); it must not import the pluginmgmt control plane (one-way edge, ARCH-P2-2)
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*compress/gzip.Writer).Close
        - (*database/sql.Rows).Close
        - (github.com/lx-wnk/kontor/server/internal/db/ent.Client).Close
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test.go
      - linters:
          - all
        path: wire_gen.go
      - linters:
          - all
        path: ent/
      - linters:
          - staticcheck
          - govet
          - revive
          - errcheck
        path: internal/db/ent/
      - linters:
          - revive
        text: stutters
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  # Defaults cap identical findings at 3 per linter, so a gate can look clean
  # while duplicates of an already-reported issue stay hidden.
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
