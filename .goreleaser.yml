# GoReleaser config — https://goreleaser.com
# Build with: goreleaser release --clean  (or `goreleaser build --snapshot --clean` to test locally)
#
# The `before` hooks build the Vue SPA into server/frontend/dist BEFORE the Go build,
# so go:embed (server/frontend/embed.go) bakes the real frontend into each binary.
version: 2

project_name: kontor

before:
  hooks:
    - pnpm install --frozen-lockfile
    - pnpm build

builds:
  - id: kontor
    dir: server
    main: ./cmd/serve
    binary: kontor
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - PRIVACY.md
      - THIRD_PARTY_LICENSES.md

checksum:
  name_template: checksums.txt

# Homebrew Cask (macOS only — Homebrew Cask is not supported on Linux;
# Linux users install via the binary one-liner or Docker).
homebrew_casks:
  - name: kontor
    binaries:
      - kontor
    repository:
      owner: lx-wnk
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: 'chore: update kontor cask to {{ .Tag }}'
    homepage: 'https://github.com/lx-wnk/kontor'
    description: Real-time monitoring dashboard for locally running Claude Code agents
    skip_upload: auto
    caveats: |
      Kontor binds to 127.0.0.1:13120 and reads ~/.claude session data.
      Never expose the dashboard port to non-loopback networks.

      Start the dashboard:
        kontor serve
      Then open http://localhost:13120
    # Strip the Gatekeeper quarantine attribute so the downloaded binary runs.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kontor"]
          end

dockers_v2:
  - id: kontor
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/lx-wnk/kontor
    tags:
      - '{{ .Version }}'
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: '{{ .Version }}'
      org.opencontainers.image.source: 'https://github.com/lx-wnk/kontor'
    sbom: false

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^refactor:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: lx-wnk
    name: kontor
  draft: false
  prerelease: auto
  footer: |
    ## Install

    **One-liner (macOS / Linux):**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/lx-wnk/kontor/main/install.sh | sh
    ```

    Or download the archive for your platform below, extract it, and move `kontor` onto your `PATH`.

    > Kontor reads your local Claude Code sessions — it binds to `127.0.0.1` only. See the [security model](https://github.com/lx-wnk/kontor/blob/main/docs/guides/security.md).
